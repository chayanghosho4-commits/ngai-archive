name: Update archive

on:
  schedule:
    - cron: "0 6 */2 * *"      # every 2 days
  workflow_dispatch:           # lets you press a "Run workflow" button
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for the last 10 days."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect papers and images
        env:
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          SINCE: ${{ github.event.inputs.since }}
          SAVE_TOC: "1"          # keep a copy of each TOC graphic in data/toc (set to "0" to only link to it)
        run: |
          if [ -n "$SINCE" ]; then python collector.py --since "$SINCE"; else python collector.py; fi
      - name: Save results
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update papers" && git push)
