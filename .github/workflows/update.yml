name: Update archive

on:
  schedule:
    - cron: "0 6 */2 * *"      # every 2 days
  workflow_dispatch:           # lets you press a "Run workflow" button
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for the last 10 days."
        required: false
        default: ""
      searches:
        description: "TOC picture searches this run (60 is normal; up to 1000 to catch up once)"
        required: false
        default: "60"
  push:                        # uploading a TOC-helper file starts a quick picture-only run
    paths:
      - "data/inbox/*.json"
      - "toc-*.json"

permissions:
  contents: write

concurrency:
  group: update-archive        # never two runs at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install picture tool
        run: pip install --quiet pillow
      - name: Collect papers and images
        env:
          CROSSREF_EMAIL: ${{ secrets.CROSSREF_EMAIL }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}   # image search by title (optional; add it under Settings > Secrets)
          IMAGE_SEARCH_LIMIT: ${{ github.event.inputs.searches || '60' }}
          SINCE: ${{ github.event.inputs.since }}
          EVENT: ${{ github.event_name }}
          SAVE_TOC: "1"          # keep a copy of each TOC graphic in data/toc (set to "0" to only link to it)
        run: |
          if [ "$EVENT" = "push" ]; then python collector.py --images-only
          elif [ -n "$SINCE" ]; then python collector.py --since "$SINCE"
          else python collector.py; fi
      - name: Save results
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update papers" && git pull --rebase -q && git push)
